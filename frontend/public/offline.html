<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05b7d7" />
    <title>You're offline — DevLink</title>
    <!--
      Fully self-contained on purpose. This page is served by the service
      worker when the network is unavailable, so it cannot rely on a
      stylesheet, a font or a script that would itself need fetching.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f8fa;
        --surface: #ffffff;
        --fg: #1f2328;
        --muted: #59636e;
        --border: #d1d9e0;
        --primary: #05b7d7;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --surface: #161b22;
          --fg: #f0f6fc;
          --muted: #9198a1;
          --border: #30363d;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.5;
      }

      main {
        width: 100%;
        max-width: 28rem;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 2.5rem 1.75rem;
      }

      .icon {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
        color: var(--muted);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        font-weight: 700;
      }

      p {
        margin: 0 0 2rem;
        color: var(--muted);
        font-size: 0.9375rem;
      }

      button {
        font: inherit;
        font-weight: 600;
        font-size: 0.875rem;
        color: #ffffff;
        background: var(--primary);
        border: 0;
        border-radius: 0.375rem;
        padding: 0.625rem 1.5rem;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.9;
      }

      button:active {
        transform: scale(0.97);
      }

      button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .status {
        margin: 1.25rem 0 0;
        font-size: 0.8125rem;
        min-height: 1.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        class="icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M2 2l20 20" />
        <path d="M8.5 16.5a5 5 0 0 1 7 0" />
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
        <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
        <path d="M5 12.86a10 10 0 0 1 5.17-2.7" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>

      <h1>You're offline</h1>
      <p>
        DevLink can't reach the network right now. Your work is safe — check your connection and try
        again.
      </p>

      <button type="button" id="retry">Try again</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
      var status = document.getElementById("status");

      document.getElementById("retry").addEventListener("click", function () {
        if (navigator.onLine) {
          window.location.reload();
        } else {
          status.textContent = "Still offline. Check your connection.";
        }
      });

      // Reload the moment connectivity comes back, so the user does not have
      // to notice and act themselves.
      window.addEventListener("online", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
